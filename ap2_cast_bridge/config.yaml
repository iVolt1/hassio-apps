name: "Cast Bridge"
version: "0.1.0"
slug: cast_bridge
description: >-
  Discovers Google Cast (Chromecast) devices on the LAN at startup and
  gives each one its own dedicated AirPlay 2 receiver, relaying audio
  through via ffmpeg + pychromecast — a more reliable alternative to
  OwnTone's built-in Cast output, which falls back to Google's "Chrome
  Audio Mirroring" receiver app and is unstable for Cast-group/stereo-pair
  targets. No manual configuration needed.
url: "https://github.com/iVolt1/hassio-apps"
arch:
  - amd64
  - aarch64
init: false
# Needed for two reasons, both requiring the container to be reachable
# on the real LAN rather than behind Docker's NAT'd bridge network:
#   1. pychromecast's zeroconf-based discovery needs to see mDNS
#      traffic from real Cast devices on the LAN.
#   2. Each zone's little HTTP server has to be reachable BY the Cast
#      device it's streaming to, at a real LAN-routable address.
host_network: true
map:
  - config:rw
  - media:rw
options: {}
schema: {}
