configuration:
  log_level:
    name: shairport-sync log level
    description: >-
      Verbosity of the per-zone shairport-sync logs. v is the least detailed,
      vv (the default) adds more, and vvv is the most detailed and grows the
      logs fastest. Restart the add-on after changing it.
  combine_sinks:
    name: Combine sinks
    description: >-
      A sink that plays to several other sinks at once (PulseAudio
      module-combine-sink), with its own AirPlay 2 zone. sinks is a
      comma-separated list of at least two sink names, e.g. Back_Yard,Workshop.
      Loaded after the remap sinks; if a member is missing it isn't loaded.
      Members on different sound cards are kept in sync by resampling.
  card_profiles:
    name: Card profiles
    description: >-
      Profile to set on a sound card at every start, before the remap sinks
      are loaded (e.g. output:analog-surround-71). Easiest to set from the web
      panel's Sound cards section. Cards not listed keep the profile
      PulseAudio gives them.
  remap_sinks:
    name: Remap sinks
    description: >-
      channels custom takes any two channels of the card as the zone's left
      and right (left/right fields, e.g. front-center and side-left; the same
      channel twice makes a mono zone).
      Leave name empty to use the sink's system name (the card's description
      plus the pair, e.g. Creative_X_Fi_Analog_Surround_7_1_rl_rr).
      Stereo sinks to carve out of a sound card, one per zone. channels picks
      which pair of the master's outputs the zone plays on (stereo = a plain
      2-channel card or USB DAC). Applied every time the add-on starts:
      missing sinks are loaded, changed ones reloaded, and removed ones
      unloaded (only sinks this add-on created). A sink whose channels another
      sink already uses is skipped (see the log). The result is also written
      to custom.pa in this add-on's config folder, for reference.
