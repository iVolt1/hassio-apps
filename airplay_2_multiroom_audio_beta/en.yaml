configuration:
  log_level:
    name: shairport-sync log level
    description: >-
      Verbosity of the per-zone shairport-sync logs. v is the least detailed,
      vv (the default) adds more, and vvv is the most detailed and grows the
      logs fastest. Restart the add-on after changing it.
  remap_sinks:
    name: Remap sinks
    description: >-
      Stereo sinks to carve out of a sound card, one per zone. channels picks
      which pair of the master's outputs the zone plays on (stereo = a plain
      2-channel card or USB DAC). Missing sinks are loaded when the add-on
      starts; a sink whose channels another sink already uses is skipped (see
      the log). They are also written to custom.pa in this add-on's config
      folder, for copying into the audio plugin's /data/custom.pa so they
      exist without the add-on. Sinks that are already loaded are not changed.
