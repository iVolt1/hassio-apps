name: Airplay2 Multiroom Audio Beta
version: 0.156
slug: airplay_2_multiroom_audio_beta
description: Create AirPlay 2 receivers from local audio devices, one per pulseaudio physical remap sink output. Remap sinks with automatic or custom names can be created in the Multi-Room Audio Controlle Home Assistand app.
arch:
  - amd64
  - aarch64
map:
  - addon_config:rw
  - media:rw
host_network: true
ingress: true
ingress_port: 8285
panel_icon: mdi:speaker-multiple
panel_title: AirPlay 2 Zones
# Only so the web panel can save this add-on's own options (POST
# /addons/self/options); the default hassio_role allows nothing broader.
hassio_api: true
# Host system bus (read-only at /run/dbus) so bt_reset.py can power-cycle the
# Bluetooth adapter through BlueZ. The add-on's own avahi bus is /run/ap2-dbus.
host_dbus: true
# NET_ADMIN/SYS_ADMIN + apparmor off: only needed for the optional ap2_ip
# mode (own LAN IP in a private network namespace, so nqptp's UDP 319/320
# doesn't collide with Music Assistant's cliairplay on the same host).
privileged:
  - NET_ADMIN
  - SYS_ADMIN
apparmor: false
audio: true
init: false
startup: services
boot: auto
backup: hot
stage: experimental
options:
  log_level: vv
  remap_sinks: []
  card_profiles: []
  combine_sinks: []
  card_options: []
  bt_reset_on_start: false
  disabled_zones: []
  enabled_zones: []
schema:
  log_level: list(v|vv|vvv)
  bt_reset_on_start: bool
  # Applied at every start (loaded / reloaded / unloaded). master is a
  # PulseAudio sink name, e.g. alsa_output.pci-0000_03_00.0.analog-surround-71
  remap_sinks:
    - name: str?
      master: str
      channels: list(front|rear|side|center_lfe|stereo|custom)
      left: str?          # channels custom only: any channel of the master,
      right: str?         # e.g. front-center + side-left (same one twice = mono)
      enabled: bool?      # false = kept in the options but not loaded (no zone)
      description: str?
  # Set at every start, before remap_sinks. card is a PulseAudio card name
  # (alsa_card...), profile one of its profiles (pactl list cards).
  card_profiles:
    - card: str
      profile: str
  # Extra module-alsa-card arguments for a card, applied by reloading it at
  # every start (e.g. mmap=no tsched=no for the Creative X-Fi mmap bug).
  card_options:
    - card: str
      options: str
  # Zones switched off in the web panel (zone keys = sink names, or the
  # Bluetooth alias); their sinks, ports and settings stay.
  disabled_zones:
    - str
  enabled_zones:
    - str
  # One sink that plays to several others at once; each gets its own zone.
  # sinks: comma-separated sink names, e.g. Back_Yard,Workshop
  combine_sinks:
    - name: str
      sinks: str
      description: str?
      enabled: bool?
  ap2_ip: str?          # e.g. 192.168.1.60/24 — empty = run on the host IP as before
  ap2_gateway: str?     # e.g. 192.168.1.1
  ap2_mac: str?         # e.g. 02:aa:bb:cc:dd:01 (fixed MAC for a DHCP exclusion/ARP stability)
  ap2_shim_ip: str?     # e.g. 192.168.1.61 — host-side shim so MA on this host can reach ap2_ip
